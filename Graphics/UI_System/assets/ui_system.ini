 
; --------------------------------------------------------------------------------------------------------------------------------------------
; General section of configuration
[general]
scraperwebscripturldownload=                                                                      ; Scrapper WEB Script URL download
showdetailinfo=0000                                             ; Show Detail info
trace_target01=3,*:10001                                                         ; eXtended Trace Aim (UDP broadcast -> local TraceServer :10001)
trace_target02=                                                 ; eXtended Trace Aim
trace_target03=                                                 ; eXtended Trace Aim
trace_target04=                                                 ; eXtended Trace Aim
trace_target05=                                                 ; eXtended Trace Aim
uiscale=1                                                                                         ; UI scale / zoom (0.75 .. 2.0)
uiscale_autofit=no                                                                                ; Autofit UI scale to window (Fase 5)
 
; --------------------------------------------------------------------------------------------------------------------------------------------
; Internet services section of configuration
[internet services]
checkinternetstatuscadenceseconds=30                                                              ; Internet connection status cadence
donotletinternetconnectionmatter=no                                                               ; Do not let Internet connection matter
checkipschangecadenceseconds=3600                                                                 ; Internet IP Change Cadence
updatetimebyntpcadencehours=4                                                                     ; Internet update time by NTP cadence
updatetimentpserver01=1.es.pool.ntp.org                                                           ; Internet update NTP Server
updatetimentpserver02=1.europe.pool.ntp.org                                                       ; Internet update NTP Server
updatetimentpserver03=3.europe.pool.ntp.org                                                       ; Internet update NTP Server
updatetimentpmeridiandifference=25                                                                ; Internet update meridian difference
updatetimentpusedaylightsaving=si                                                                 ; Internet update time day light saving
 
; --------------------------------------------------------------------------------------------------------------------------------------------
; Log section of configuration
[log]
isactive=si                                                     ; Activate log generation
backupisactive=si                                               ; Activate backup for the log
backupmaxfiles=10                                               ; Maximum number of backup files (ZIP)
backupiscompress=si                                             ; Activate compression in log backup
activesectionsID=Ini,General,Status,End                         ; Activate section filter by ID in the log
levelmask=000F                                                  ; Filter by level mask
maxsize=3000                                                    ; Limit of the main file to perform the backup (in Kb)
reductionpercent=10                                              ; Reduction (percentage) of the main file when performing backup
